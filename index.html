<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оставить чаевые</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f4f5f7; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .card { background: #ffffff; border-radius: 24px; padding: 20px; width: 100%; max-width: 420px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center; }
        
        h2 { font-size: 20px; color: #1a1a1a; margin-bottom: 5px; }
        p.subtitle { color: #8e8e93; font-size: 14px; margin-bottom: 20px; }
        
        /* Список официантов */
        .waiters-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .waiter-card { background: #f9f9fb; border: 2px solid transparent; border-radius: 16px; padding: 10px 5px; cursor: pointer; transition: all 0.2s; }
        .waiter-card.active { border-color: #007aff; background: #f0f6ff; }
        .waiter-avatar { width: 55px; height: 55px; border-radius: 50%; object-fit: cover; margin-bottom: 6px; }
        .waiter-name { font-size: 14px; font-weight: 600; color: #1c1c1e; }
        .waiter-role { font-size: 11px; color: #8e8e93; }

        /* Выбор суммы */
        .grid-amounts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
        .btn-amount { background: #f0f2f5; border: 2px solid transparent; border-radius: 12px; padding: 12px 0; font-size: 16px; font-weight: 600; color: #333; cursor: pointer; }
        .btn-amount.active { border-color: #007aff; background: #eaf2ff; color: #007aff; }
        
        input[type="number"] { width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 12px; font-size: 16px; text-align: center; margin-bottom: 20px; outline: none; }
        
        /* Кнопка оплаты */
        .btn-pay { width: 100%; background: #000; color: #fff; border: none; border-radius: 16px; padding: 16px; font-size: 17px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-pay:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="card">
    <h2>Кому оставить чаевые?</h2>
    <p class="subtitle">Выберите сотрудника и сумму</p>

    <!-- Сетка сотрудников -->
    <div class="waiters-grid" id="waitersList">
        <p style="grid-column: span 3;">Загрузка сотрудников...</p>
    </div>

    <!-- Выбор суммы -->
    <div class="grid-amounts">
        <button class="btn-amount" onclick="selectAmount(100, this)">100 ₽</button>
        <button class="btn-amount active" onclick="selectAmount(200, this)">200 ₽</button>
        <button class="btn-amount" onclick="selectAmount(500, this)">500 ₽</button>
    </div>

    <input type="number" id="customAmount" value="200" placeholder="Другая сумма" oninput="clearActiveButtons()">

    <!-- Кнопка оплаты -->
    <button class="btn-pay" id="payBtn" onclick="payWithSBP()">
        Оплатить через СБП
    </button>
</div>

<script>
    let selectedWaiterId = null;
    let currentAmount = 200;

    // 1. Загружаем сотрудников с сервера
    async function loadWaiters() {
        try {
            const res = await fetch('/api/waiters');
            const waiters = await res.json();
            
            const listEl = document.getElementById('waitersList');
            listEl.innerHTML = '';

            waiters.forEach((w, index) => {
                const card = document.createElement('div');
                card.className = `waiter-card ${index === 0 ? 'active' : ''}`;
                if(index === 0) selectedWaiterId = w.id; // По умолчанию выбираем первого

                card.onclick = () => selectWaiter(w.id, card);
                card.innerHTML = `
                    <img src="${w.avatar}" class="waiter-avatar">
                    <div class="waiter-name">${w.name}</div>
                    <div class="waiter-role">${w.role}</div>
                `;
                listEl.appendChild(card);
            });
        } catch (e) {
            alert('Ошибка загрузки сотрудников');
        }
    }

    function selectWaiter(id, cardElement) {
        selectedWaiterId = id;
        document.querySelectorAll('.waiter-card').forEach(c => c.classList.remove('active'));
        cardElement.classList.add('active');
    }

    function selectAmount(amount, element) {
        currentAmount = amount;
        document.getElementById('customAmount').value = amount;
        document.querySelectorAll('.btn-amount').forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
    }

    function clearActiveButtons() {
        document.querySelectorAll('.btn-amount').forEach(btn => btn.classList.remove('active'));
        currentAmount = document.getElementById('customAmount').value;
    }

    // 2. Оплата СБП
    async function payWithSBP() {
        if (!selectedWaiterId) {
            alert('Пожалуйста, выберите сотрудника');
            return;
        }

        const amount = document.getElementById('customAmount').value;
        if (!amount || amount <= 0) {
            alert('Введите сумму');
            return;
        }

        try {
            const response = await fetch('/api/create-pay-link', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ waiterId: selectedWaiterId, amount: amount })
            });

            const data = await response.json();

            if (data.sbpUrl) {
                // Прямой переход для iPhone и Android в банк
                window.location.assign(data.sbpUrl);
            } else {
                alert('Ошибка: ' + data.error);
            }
        } catch (err) {
            alert('Ошибка при отправке запроса');
        }
    }

    // Запускаем при загрузке страницы
    loadWaiters();
</script>

</body>
</html>
