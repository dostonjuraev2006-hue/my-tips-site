<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оставить чаевые</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f4f5f7; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #ffffff; border-radius: 20px; padding: 25px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center; }
        .avatar { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin-bottom: 15px; }
        h2 { font-size: 20px; color: #1a1a1a; margin-bottom: 5px; }
        p.subtitle { color: #666; font-size: 14px; margin-bottom: 25px; }
        
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        .btn-amount { background: #f0f2f5; border: 2px solid transparent; border-radius: 12px; padding: 12px 0; font-size: 16px; font-weight: 600; color: #333; cursor: pointer; transition: all 0.2s; }
        .btn-amount.active { border-color: #007aff; background: #eaf2ff; color: #007aff; }
        
        input[type="number"] { width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 12px; font-size: 16px; text-align: center; margin-bottom: 20px; outline: none; }
        input[type="number"]:focus { border-color: #007aff; }

        .btn-pay { width: 100%; background: #000; color: #fff; border: none; border-radius: 14px; padding: 16px; font-size: 18px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-pay:hover { opacity: 0.9; }
        .sbp-logo { width: 25px; height: 25px; background: #fff; border-radius: 4px; padding: 2px; }
    </style>
</head>
<body>

<div class="card">
    <!-- Фото официанта/ресторана -->
    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200" alt="Официанат" class="avatar">
    <h2>Официант Анна</h2>
    <p class="subtitle">Ресторан "Уют & Вкус"</p>

    <!-- Выбор фиксированной суммы -->
    <div class="grid">
        <button class="btn-amount" onclick="selectAmount(100, this)">100 ₽</button>
        <button class="btn-amount active" onclick="selectAmount(200, this)">200 ₽</button>
        <button class="btn-amount" onclick="selectAmount(500, this)">500 ₽</button>
    </div>

    <!-- Ввод своей суммы -->
    <input type="number" id="customAmount" value="200" placeholder="Другая сумма" oninput="clearActiveButtons()">

    <!-- Кнопка оплаты СБП -->
    <button class="btn-pay" onclick="payWithSBP()">
        <svg class="sbp-logo" viewBox="0 0 24 24"><path fill="#000" d="M12 2L2 19h20L12 2zm0 3.8L18.5 17H5.5L12 5.8z"/></svg>
        Оплатить через СБП
    </button>
</div>

<script>
    let currentAmount = 200;

    function selectAmount(amount, element) {
        currentAmount = amount;
        document.getElementById('customAmount').value = amount;
        
        document.querySelectorAll('.btn-amount').forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
    }

    function clearActiveButtons() {
        document.querySelectorAll('.btn-amount').forEach(btn => btn.classList.remove('active'));
        currentAmount = document.getElementById('customAmount').value;
    }

    async function payWithSBP() {
        const amount = document.getElementById('customAmount').value;
        if (!amount || amount <= 0) {
            alert('Пожалуйста, введите сумму');
            return;
        }

        try {
            // Отправляем запрос на наш бэкенд для создания СБП ссылки
            const response = await fetch('/api/create-pay-link', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ amount: amount })
            });

            const data = await response.json();

            if (data.sbpUrl) {
                // Перенаправляем клиента на ссылку СБП (НСПК)
                // На телефоне автоматически откроется выбор банков!
                window.location.href = data.sbpUrl;
            } else {
                alert('Ошибка создания платежа: ' + data.error);
            }
        } catch (err) {
            alert('Ошибка сервера при формировании оплаты');
            console.error(err);
        }
    }
</script>

</body>
</html>
